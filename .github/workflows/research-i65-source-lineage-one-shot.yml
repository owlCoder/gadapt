name: I65 ORPD source-case and scenario lineage (one-shot)

# Direct child of original manual root, deliberately single development case.
# No push, PR, schedule, held-out experiment, or optimizer calls.
on:
  workflow_run:
    workflows:
      - "Research full-clone migration regression (manual only)"
    types: [completed]

permissions:
  contents: read

jobs:
  audit-public-case-lineage:
    if: ${{ github.event.workflow_run.id == 41357664531 && github.event.workflow_run.run_attempt == 9 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Full-history checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Minimal pinned source audit dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -e .
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==1.26.4' 'scipy>=1.15,<1.17' 'PYPOWER==5.1.19' 'networkx>=3,<4'
          .venv/bin/python -m pip check
      - name: Data-lineage synthetic tests and one OPF-only source replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lineage"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/lineage/commit.txt"
          trap '( cd "$RUNNER_TEMP/lineage"; for f in *.log *.json commit.txt; do if [ -f "$f" ]; then sha256sum "$f"; fi; done ) > "$RUNNER_TEMP/lineage/hashes.sha256"' EXIT
          .venv/bin/python -m unittest discover -s research/i65 -p 'test_input_provenance_audit.py' -v 2>&1 | tee "$RUNNER_TEMP/lineage/unit.log"
          .venv/bin/python research/compat/restore_legacy_paths.py --apply --verify 2>&1 | tee "$RUNNER_TEMP/lineage/restore.log"
          timeout 120s .venv/bin/python research/i65/smoke_input_provenance_audit.py 2>&1 | tee "$RUNNER_TEMP/lineage/smoke.json"
          .venv/bin/python -m json.tool "$RUNNER_TEMP/lineage/smoke.json" > /dev/null
      - name: Archive raw source-lineage evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i65-source-lineage-${{ github.run_id }}
          path: ${{ runner.temp }}/lineage/
          if-no-files-found: warn
          retention-days: 30
