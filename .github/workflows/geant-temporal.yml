name: GÉANT 2005 chronological traffic validation

on:
  push:
    branches:
      - "research/**"
    paths:
      - "research/geant_temporal_benchmark.py"
      - ".github/workflows/geant-temporal.yml"
  workflow_dispatch:

jobs:
  measured-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . 'scipy>=1.11,<1.16' 'networkx>=3.2,<4'
      - run: python -m research.geant_temporal_benchmark --runs 30 --budget 360 --output geant_temporal_results.csv | tee geant_temporal_log.txt
      - run: python -m research.analyze_geant_temporal geant_temporal_results.csv | tee geant_temporal_stats.txt
      - uses: actions/upload-artifact@v4
        with:
          name: geant-chronological-measured-traffic
          path: |
            geant_temporal_results.csv
            geant_temporal_log.txt
            geant_temporal_stats.txt
