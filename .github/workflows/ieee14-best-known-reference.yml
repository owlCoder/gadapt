name: IEEE14 independent best-known feasible reference

on:
  push:
    branches: [main]
    paths:
      - "research/ieee14_best_known_reference.py"
      - ".github/workflows/ieee14-best-known-reference.yml"
  workflow_dispatch:

jobs:
  high-budget-noncertified-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . 'scipy>=1.11,<1.16' 'pypower>=5.1,<6'
      - name: Run high-budget true-PF dual-stage search with independent voltage audit
        run: |
          set -o pipefail
          python -m research.ieee14_best_known_reference --budget 3600 --de-stage 2000 --output ieee14_best_known_reference.csv | tee ieee14_reference_log.txt
          test -s ieee14_best_known_reference.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ieee14-independently-verified-best-known-3600-PF
          path: |
            ieee14_best_known_reference.csv
            ieee14_reference_log.txt
