name: I33 GÉANT Real Routing Six-Arm Transfer
# I33 single preregistered PR verification event; none of the six arms or metrics changed

on:
  push:
    branches: [main]
    paths:
      - 'research/ITERATION33_PROTOCOL.md'
      - 'research/ITERATION33_GEANT_MODEL_AUDIT_SR.md'
      - 'research/iteration33_geant_routing_budget.py'
      - 'research/test_iteration33_geant_routing_budget.py'
      - '.github/workflows/research-iteration33-geant-routing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/ITERATION33_PROTOCOL.md'
      - 'research/ITERATION33_GEANT_MODEL_AUDIT_SR.md'
      - 'research/iteration33_geant_routing_budget.py'
      - 'research/test_iteration33_geant_routing_budget.py'
      - '.github/workflows/research-iteration33-geant-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  preflight-no-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin public-route dependency stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'scipy==1.13.1' 'pandas==2.2.3' 'networkx==3.4.2' 'pypower==5.1.19' 'pandapower==2.14.11'
          python -m pip install -e .
      - name: Syntax and synthetic no-real-route tests before I33 source simulations
        run: |
          python -m py_compile research/iteration33_geant_routing_budget.py research/test_iteration33_geant_routing_budget.py
          python -m unittest -v research.test_iteration33_geant_routing_budget
          python -m unittest -v research.test_iteration32_ieee14_topology_transfer
          python -m unittest -v tests.test_sequential_scenario_budget_cost

  measured-sndlib-geant:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: preflight-no-routing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned networkx Dijkstra and numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'scipy==1.13.1' 'pandas==2.2.3' 'networkx==3.4.2' 'pypower==5.1.19' 'pandapower==2.14.11'
          python -m pip install -e .
      - name: PRE I33 actual evaluations verify original SNDlib SHA then run exactly 72 frozen domain optimizer runs
        run: |
          mkdir -p research/results
          python -m research.iteration33_geant_routing_budget \
            --json research/results/geant_i33_12seed_6arm_raw_real_routes.json \
            --csv research/results/geant_i33_12seed_6arm_raw_real_routes.csv
      - name: Preserve original 72 row JSON CSV even on export exception
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i33-geant-12seeds-sixarm-genuine-traffic-routing
          path: |
            research/results/geant_i33_12seed_6arm_raw_real_routes.json
            research/results/geant_i33_12seed_6arm_raw_real_routes.csv
          if-no-files-found: warn
          retention-days: 90
