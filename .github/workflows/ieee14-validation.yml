name: IEEE14 AC engineering pilot

on:
  push:
    branches:
      - "research/**"
    paths:
      - "research/ieee14_voltage.py"
      - ".github/workflows/ieee14-validation.yml"
      - "gadapt/**"
  workflow_dispatch:

jobs:
  ac-ieee14-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . 'scipy>=1.11,<1.16' pypower==5.1.19
      - run: python -m unittest discover -s research/tests -v
      - run: python research/ieee14_voltage.py --runs 12 --budget 240 --output ieee14_pilot.csv | tee ieee14_pilot_summary.txt
      - run: python research/analyze_ieee14.py ieee14_pilot.csv | tee ieee14_statistics.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ieee14-ac-pilot
          path: |
            ieee14_pilot.csv
            ieee14_pilot_summary.txt
            ieee14_statistics.txt
