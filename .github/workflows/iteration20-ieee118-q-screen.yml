name: Iteration 20 IEEE118 source Q sensitivity 8 real AC solves

on:
  push:
    branches: [main]
    paths:
      - "research/ITERATION20_PROTOCOL.md"
      - "research/iteration20_ieee118_reactive_sensitivity.py"
      - "research/test_iteration20_ieee118_reactive_sensitivity.py"
      - ".github/workflows/iteration20-ieee118-q-screen.yml"
  workflow_dispatch:

jobs:
  source-Q-physical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pin-locked IEEE118 original source AC environment
        run: python -m pip install -e . 'pypower==5.1.19' 'pandapower==2.14.11' 'scipy==1.13.1' 'pandas==2.2.3'
      - name: Verify two source offender identities and eight unique bounded delta-VG controls
        run: python -m unittest -v research.test_iteration20_ieee118_reactive_sensitivity research.test_iteration19_ieee118_forensic_diagnostic
      - name: Perform 8 genuine bounded IEEE118 AC NR sensitivity solves
        run: python -m research.iteration20_ieee118_reactive_sensitivity --json iteration20_ieee118_q_screen.json --csv iteration20_ieee118_q_screen.csv
      - name: Emit true raw results for permanent branch archive
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for kind,fn in (("CSV","iteration20_ieee118_q_screen.csv"),
                          ("JSON","iteration20_ieee118_q_screen.json")):
              p=Path(fn)
              if p.exists():
                  encoded=base64.b64encode(p.read_bytes()).decode("ascii")
                  for i,k in enumerate(range(0,len(encoded),2048)):
                      print("I20_ARCHIVE",kind,i,encoded[k:k+2048],flush=True)
              else:
                  print("I20_MISSING",kind,flush=True)
          PY
      - name: Archive both negative and positive Q sensitivity outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration20-IEEE118-8-genuine-Q-PV-sensitivities
          path: |
            iteration20_ieee118_q_screen.csv
            iteration20_ieee118_q_screen.json
