name: IEEE14 budget-matched memetic baseline audit

on:
  push:
    branches: [main]
    paths:
      - "research/ieee14_local_refinement.py"
      - "research/analyze_ieee14_local_refinement.py"
      - "research/ITERATION5_PROTOCOL.md"
      - ".github/workflows/ieee14-local-refinement.yml"
  workflow_dispatch:

jobs:
  ieee14-physical-solver-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real GAdapt and AC solver
        run: python -m pip install -e . 'scipy>=1.11,<1.16' 'pypower>=5.1,<6'
      - name: Run frozen 5-method 12-seed AC PF audit
        run: |
          set -o pipefail
          python -m research.ieee14_local_refinement --seeds 12 --seed-start 100 --budget 360 --output ieee14_local_refinement.csv | tee ieee14_local_refinement_log.txt
          test -s ieee14_local_refinement.csv
      - name: Analyze all physical failures and matched seed differences
        run: |
          set -o pipefail
          python -m research.analyze_ieee14_local_refinement ieee14_local_refinement.csv | tee ieee14_local_refinement_statistics.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ieee14-budget-matched-memetic-real-ac-pf
          path: |
            ieee14_local_refinement.csv
            ieee14_local_refinement_log.txt
            ieee14_local_refinement_statistics.txt
