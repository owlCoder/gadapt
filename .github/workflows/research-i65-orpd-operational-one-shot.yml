name: I65 ORPD four operational constraints (one-shot)

# Research-only and no optimizer. Direct workflow_run child of original manual
# root avoids GitHub's three-level chained workflow_run limit.
# Explicitly bound to a single authorized inexpensive retry, not push/PR/schedule.
on:
  workflow_run:
    workflows:
      - "Research full-clone migration regression (manual only)"
    types: [completed]

permissions:
  contents: read

jobs:
  i56-constraint-audit:
    if: ${{ github.event.workflow_run.id == 41357664531 && github.event.workflow_run.run_attempt == 4 }
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Full-history main checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pinned Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal compatible historical unit-test stack
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -e .
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==1.26.4' 'scipy>=1.15,<1.17' 'PYPOWER==5.1.19' 'cma>=3,<5' 'networkx>=3,<4'
          .venv/bin/python -m pip check

      - name: Constraint unit tests and one predeclared development case30 diagnosis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/constraints"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/constraints/commit.txt"
          .venv/bin/python -m unittest discover -s research/i65 -p 'test_orpd_operational_witness.py' -v 2>&1 | tee "$RUNNER_TEMP/constraints/unit.log"
          .venv/bin/python research/compat/restore_legacy_paths.py --apply --verify 2>&1 | tee "$RUNNER_TEMP/constraints/restore.log"
          timeout 120s .venv/bin/python research/i65/smoke_orpd_operational_constraints.py 2>&1 | tee "$RUNNER_TEMP/constraints/smoke.json"
          .venv/bin/python -m json.tool "$RUNNER_TEMP/constraints/smoke.json" > /dev/null
          (cd "$RUNNER_TEMP/constraints" && sha256sum *.log smoke.json commit.txt > hashes.sha256)

      - name: Archive PASS and FAIL evidence with hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i65-orpd-operational-constraints-${{ github.run_id }}
          path: ${{ runner.temp }}/constraints/
          if-no-files-found: warn
          retention-days: 30
