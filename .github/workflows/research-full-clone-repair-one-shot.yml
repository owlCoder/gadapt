name: I65 full-clone repair verification (one-shot)

# Follow up exactly the failed original manual invocation after a deliberate
# rerun; does not listen to pushes, PRs or schedules, and cannot self-trigger.
on:
  workflow_run:
    workflows:
      - "Research full-clone migration regression (manual only)"
    types: [completed]

permissions:
  contents: read

jobs:
  repaired-full-clone-gate:
    if: ${{ github.event.workflow_run.id == 41357664531 && github.event.workflow_run.run_attempt == 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Full default-branch clone, including pre-migration history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pinned Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned, compatible core unit-test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -e .
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==1.26.4' 'scipy>=1.15,<1.17' 'pytest>=8,<10' 'hypothesis>=6,<7' 'cma>=3,<5' 'networkx>=3,<4' 'PYPOWER==5.1.19'
          .venv/bin/python -m pip check

      - name: Full-clone regression gate (bounded; no confirmatory research)
        run: |
          .venv/bin/python research/compat/run_full_clone_gate.py \
            --python "$GITHUB_WORKSPACE/.venv/bin/python" \
            --expected-head "$GITHUB_SHA" \
            --run \
            --report-dir "$RUNNER_TEMP/gadapt-full-clone-gate" \
            --timeout 120

      - name: Upload evidence even if any gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gadapt-repaired-full-clone-${{ github.run_id }}
          path: ${{ runner.temp }}/gadapt-full-clone-gate/
          if-no-files-found: warn
          retention-days: 30
