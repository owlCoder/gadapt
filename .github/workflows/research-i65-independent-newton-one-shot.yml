name: I65 independent Newton AC PF comparison (one-shot)

# No push/PR/schedule/manual trigger. Direct first-level workflow_run child
# of known root CI attempt 7; never starts optimization or held-out COCO.
on:
  workflow_run:
    workflows:
      - "Research full-clone migration regression (manual only)"
    types: [completed]

permissions:
  contents: read

jobs:
  independent-newton:
    if: ${{ github.event.workflow_run.id == 41357664531 && github.event.workflow_run.run_attempt == 7 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Minimal pinned development diagnostic dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -e .
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==1.26.4' 'scipy>=1.15,<1.17' 'PYPOWER==5.1.19' 'networkx>=3,<4'
          .venv/bin/python -m pip check

      - name: Run 16 standalone tests and one predeclared development PF comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/newton"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/newton/commit.txt"
          trap '( cd "$RUNNER_TEMP/newton"; for f in *.log *.json commit.txt; do if [ -f "$f" ]; then sha256sum "$f"; fi; done ) > "$RUNNER_TEMP/newton/hashes.sha256"' EXIT
          .venv/bin/python -m unittest discover -s research/i65 -p 'test_independent_ac_newton.py' -v 2>&1 | tee "$RUNNER_TEMP/newton/unit.log"
          .venv/bin/python research/compat/restore_legacy_paths.py --apply --verify 2>&1 | tee "$RUNNER_TEMP/newton/restore.log"
          timeout 120s .venv/bin/python research/i65/smoke_independent_ac_newton.py 2>&1 | tee "$RUNNER_TEMP/newton/smoke.json"
          .venv/bin/python -m json.tool "$RUNNER_TEMP/newton/smoke.json" > /dev/null

      - name: Preserve raw evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i65-independent-newton-${{ github.run_id }}
          path: ${{ runner.temp }}/newton/
          if-no-files-found: warn
          retention-days: 30
