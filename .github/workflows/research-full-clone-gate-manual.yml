name: Research full-clone migration regression (manual only)

# No push, pull_request, schedule or automatic execution. This can be run only
# after a user intentionally dispatches it from the Actions UI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-clone-core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout all Git history and tracked symlinks
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the project's Python 3.12 runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install only cheap unit-test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -e .
          # Install the package's exact NumPy dependency in the *same*
          # transaction as SciPy so the resolver cannot replace it with 2.x.
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==1.26.4' 'scipy>=1.15,<1.17' 'pytest>=8,<10' 'hypothesis>=6,<7' 'cma>=3,<5' 'networkx>=3,<4'
          .venv/bin/python -m pip check

      - name: Execute bounded full-checkout core regression and capture SHA logs
        run: |
          .venv/bin/python research/compat/run_full_clone_gate.py \
            --python "$GITHUB_WORKSPACE/.venv/bin/python" \
            --expected-head "$GITHUB_SHA" \
            --run \
            --report-dir "$RUNNER_TEMP/gadapt-full-clone-gate" \
            --timeout 120

      - name: Archive gate evidence, even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gadapt-full-clone-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/gadapt-full-clone-gate/
          if-no-files-found: warn
          retention-days: 30
