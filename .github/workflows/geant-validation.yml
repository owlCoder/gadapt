name: GÉANT real-traffic validation

on:
  push:
    branches:
      - "research/**"
    paths:
      - "research/geant_capacity.py"
      - ".github/workflows/geant-validation.yml"
      - "gadapt/**"
  workflow_dispatch:

jobs:
  geant-network:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . 'scipy>=1.11,<1.16' 'networkx>=3.2,<4'
      - run: python research/geant_capacity.py --runs 4 --budget 120 --output geant_pilot.csv | tee geant_summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: geant-real-traffic-pilot
          path: |
            geant_pilot.csv
            geant_summary.txt
