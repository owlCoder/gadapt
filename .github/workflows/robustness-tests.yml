name: Robustness regression tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# This lean-main workflow intentionally performs NO optimization,
# benchmark-objective evaluations, physics, AC/PF/OPF or held-out COCO.
# Original historical research workflows are safely preserved in the
# archive/pre-reliability-cleanup-2026-11-04 branch.
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
