name: Robustness regression tests

on:
  push:
    branches:
      - "research/**"
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  exploratory-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python research/benchmark_affine.py --runs 12 --generations 120 --output affine_results.csv | tee affine_summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: affine-benchmark-pilot
          path: |
            affine_results.csv
            affine_summary.txt
