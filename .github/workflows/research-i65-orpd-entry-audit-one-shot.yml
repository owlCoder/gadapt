name: I65 PYPOWER entrypoint audit (one-shot)

# Intentionally no push, PR, schedule or manual dispatch. Runs once only,
# after a specifically authorized rerun of known low-cost CI job #41358768925.
on:
  workflow_run:
    workflows:
      - "I65 full-clone PYPOWER repair verification (one-shot)"
    types: [completed]

permissions:
  contents: read

jobs:
  entrypoint-smoke:
    if: ${{ github.event.workflow_run.id == 41358768925 && github.event.workflow_run.run_attempt == 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout full-history read-only source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the same tested lightweight PYPOWER stack
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -e .
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==1.26.4' 'scipy>=1.15,<1.17' 'PYPOWER==5.1.19' 'cma>=3,<5' 'networkx>=3,<4'
          .venv/bin/python -m pip check

      - name: Cheap fail-closed API-entrypoint tests and one dev-case witness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/solver-entry-audit"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/solver-entry-audit/commit.txt"
          .venv/bin/python -m unittest discover -s research/i65 -p 'test_orpd_solver_entry_audit.py' -v 2>&1 | tee "$RUNNER_TEMP/solver-entry-audit/unit.log"
          .venv/bin/python research/compat/restore_legacy_paths.py --apply --verify 2>&1 | tee "$RUNNER_TEMP/solver-entry-audit/restore.log"
          timeout 120s .venv/bin/python research/i65/smoke_orpd_solver_entrypoints.py 2>&1 | tee "$RUNNER_TEMP/solver-entry-audit/smoke.json"
          (cd "$RUNNER_TEMP/solver-entry-audit" && sha256sum *.log smoke.json commit.txt > hashes.sha256)
          .venv/bin/python -m json.tool "$RUNNER_TEMP/solver-entry-audit/smoke.json" > /dev/null

      - name: Archive complete raw smoke evidence even if unsuccessful
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i65-orpd-solver-entry-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/solver-entry-audit/
          if-no-files-found: warn
          retention-days: 30
