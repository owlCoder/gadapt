name: I65 one-time original I55 NPZ archival attestation

# This workflow runs ONLY for the specifically named archival issue.
# It is read-only: no optimizer, power flow, COCO, or new research experiment.
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  archive-replay:
    if: github.event.issue.title == '[I65 I55 raw archive replay] 2026-11-03'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only NPZ decoder
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Test archival attestation code, without optimizer calls
        run: |
          for suite in test_i55_npz_git_blob_manifest_gate.py test_i55_npz_cross_archive_verifier.py test_i55_frozen_objective_oracle.py test_i55_full_npz_attestation.py; do
            python -m unittest discover -s research/i65/archive_review -p "$suite" -v
          done
      - name: Read original 620 NPZ files and independently rederive hashes, f(x), flags
        run: |
          python research/i65/archive_review/i55_full_npz_attestation.py \
            --repo-root . --output i55_original_620_npz_attestation.json
      - name: Upload final attestation, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i65-i55-archive-attestation-one-time-2026-11-03
          path: i55_original_620_npz_attestation.json
          if-no-files-found: warn
