name: Iteration 7 independent paired statistics from immutable source-rated CSV

on:
  push:
    branches: [main]
    paths:
      - "research/results/rte1888_iteration7_source_rated_pilot_20261021.csv"
      - ".github/workflows/iteration7-source-rated-analysis.yml"
  workflow_dispatch:

jobs:
  independent-source-rte-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . 'pandapower==2.14.11' 'scipy==1.13.1' 'pandas==2.2.3' 'matplotlib==3.9.2'
      - name: Check frozen statistical protocol
        run: python -m unittest -v research.test_iteration7_stats
      - name: Reanalyze versioned fifteen-run physical CSV independently
        run: |
          python -m research.analyze_iteration7_source_rated research/results/rte1888_iteration7_source_rated_pilot_20261021.csv --summary rte1888_iteration7_stats.json --figure rte1888_iteration7_violation
      - name: Log exact printable summary and plot provenance for archival
        if: always()
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ("rte1888_iteration7_stats.json","rte1888_iteration7_violation.svg","rte1888_iteration7_violation.png"):
              p=Path(name)
              if p.exists():
                  val=base64.b64encode(p.read_bytes()).decode()
                  for pos in range(0,len(val),2048):
                      print("I7_ANALYSIS_B64",name,pos//2048,val[pos:pos+2048],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iteration7-rte-source-rated-verified-statistics
          path: |
            rte1888_iteration7_stats.json
            rte1888_iteration7_violation.svg
            rte1888_iteration7_violation.png
