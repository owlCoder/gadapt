name: GÉANT budget-matched memetic routing audit

on:
  push:
    branches: [main]
    paths:
      - "research/geant_local_refinement.py"
      - "research/analyze_geant_local_refinement.py"
      - ".github/workflows/geant-local-refinement.yml"
  workflow_dispatch:

jobs:
  geant-memetic-verified-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . 'scipy>=1.11,<1.16' 'networkx>=3.2,<4'
      - name: Repeat inspected GÉANT block with 360 true training calls
        run: |
          set -o pipefail
          python -m research.geant_local_refinement --seeds 8 --seed-start 100 --budget 360 --output geant_local_refinement.csv | tee geant_local_refinement_log.txt
          test -s geant_local_refinement.csv
      - name: Paired rank tests with failures included
        run: |
          set -o pipefail
          python -m research.analyze_geant_local_refinement geant_local_refinement.csv | tee geant_local_refinement_stats.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geant-real-package-discrete-memetic-raw
          path: |
            geant_local_refinement.csv
            geant_local_refinement_log.txt
            geant_local_refinement_stats.txt
