name: Iteration 7 conditional transformer feasibility certificate

on:
  push:
    branches: [main]
    paths:
      - "research/iteration7_leaf_certificate.py"
      - "research/test_iteration7_leaf_certificate.py"
      - ".github/workflows/iteration7-leaf-certificate.yml"
  workflow_dispatch:

jobs:
  structural-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . 'pandapower==2.14.11' 'scipy==1.13.1' 'pandas==2.2.3'
      - name: Run pure topology and thermal proof regression tests
        run: python -m unittest -v research.test_iteration7_leaf_certificate
      - name: Screen 15 observed transformer terminal violations analytically
        run: python -m research.iteration7_leaf_certificate --output rte1888_leaf_certificate.json
      - name: Preserve exact JSON for repository archival
        if: always()
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path("rte1888_leaf_certificate.json")
          if p.exists():
              b=base64.b64encode(p.read_bytes()).decode()
              for j in range(0,len(b),2048):
                  print("I7_CERT_B64",j//2048,b[j:j+2048],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iteration7-rte1888-conditional-certificate
          path: rte1888_leaf_certificate.json
