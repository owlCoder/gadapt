name: I65 I55 frozen NPZ read-only attestation (manual)

# Deliberately manual-only. NEVER run optimizers, physical models or COCO here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-trace-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full original Git history and archived NPZ bytes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy for read-only .npz decoding
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Run synthetic fail-closed tests
        run: python -m unittest discover -s research/i65/archive_review -p test_i55_full_npz_attestation.py -v
      - name: Validate frozen objective-value oracle and trace replay (synthetic)
        run: |
          python -m unittest discover -s research/i65/archive_review -p test_i55_frozen_objective_oracle.py -v
          python -m unittest discover -s research/i65/archive_review -p test_i55_npz_cross_archive_verifier.py -v
          python -m unittest discover -s research/i65/archive_review -p test_i55_npz_git_blob_manifest_gate.py -v
      - name: Verify source tree, source bytes, all original trace digests, detector flags and objective values
        run: |
          python research/i65/archive_review/i55_full_npz_attestation.py \
            --repo-root . \
            --output i55_original_620_npz_attestation.json
      - name: Preserve attestation, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i55-original-npz-readonly-attestation
          path: i55_original_620_npz_attestation.json
          if-no-files-found: warn
