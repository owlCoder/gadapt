name: Iteration 8 RTE1888 reactive-voltage source-rated screen

on:
  push:
    branches: [main]
    paths:
      - "research/ITERATION8_PROTOCOL.md"
      - "research/iteration8_reactive_screen.py"
      - "research/test_iteration8_reactive_screen.py"
      - ".github/workflows/iteration8-rte-reactive-screen.yml"
  workflow_dispatch:

jobs:
  reactive-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned solver environment
        run: python -m pip install -e . 'pandapower==2.14.11' 'scipy==1.13.1' 'pandas==2.2.3'
      - name: Regression tests before AC measurements
        run: python -m unittest -v research.test_iteration8_reactive_screen research.test_iteration7_source_physics
      - name: Run registered real AC reactive-voltage sensitivity screen
        run: |
          python -m research.iteration8_reactive_screen --csv iteration8_reactive_screen.csv --json iteration8_reactive_screen.json
      - name: Record exact reproducible data for provenance
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for name, filename in (("CSV","iteration8_reactive_screen.csv"),("JSON","iteration8_reactive_screen.json")):
              path=Path(filename)
              if not path.exists():
                  print("I8_MISSING", name, flush=True)
                  continue
              value=base64.b64encode(path.read_bytes()).decode("ascii")
              for offset in range(0,len(value),2048):
                  print("I8_ARCHIVE",name,offset//2048,value[offset:offset+2048],flush=True)
          PY
      - name: Retain raw successful and failed AC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration8-rte1888-reactive-screen
          path: |
            iteration8_reactive_screen.csv
            iteration8_reactive_screen.json
