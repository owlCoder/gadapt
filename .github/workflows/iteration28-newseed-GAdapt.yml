name: Iteration 28 twelve NEW paired seeds in-core GAdapt robust credit replication

on:
  push:
    branches: [main]
    paths:
      - "research/ITERATION28_PROTOCOL.md"
      - "research/iteration28_newseed_scenario_credit_replication.py"
      - "research/test_iteration28_newseed_replication.py"
      - ".github/workflows/iteration28-newseed-GAdapt.yml"
  workflow_dispatch:

jobs:
  true-source-IEEE118-12-new-paired-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned genuine IEEE118 native powerflow dependencies
        run: python -m pip install -e . 'pypower==5.1.19' 'pandapower==2.14.11' 'scipy==1.13.1' 'pandas==2.2.3'
      - name: "Verify frozen I28 new seeds, equal budgets, paired totals, and I26 core operator credit"
        run: python -m unittest -v research.test_iteration28_newseed_replication research.test_iteration27_real_scenario_credit_benchmark tests.test_scenario_feasibility_credit
      - name: Execute all forty-eight new seed real IEEE118 GA jobs with 8640 real AC maximum
        run: python -m research.iteration28_newseed_scenario_credit_replication --json iteration28_seed_holdout.json --csv iteration28_seed_holdout.csv
      - name: Emit raw 12 seed 4 method results for permanent GitHub research archive
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for kind,path in (("CSV","iteration28_seed_holdout.csv"),
                            ("JSON","iteration28_seed_holdout.json")):
              p=Path(path)
              if p.is_file():
                  b=base64.b64encode(p.read_bytes()).decode("ascii")
                  for j,k in enumerate(range(0,len(b),2048)):
                      print("I28_ARCHIVE",kind,j,b[k:k+2048],flush=True)
              else:
                  print("I28_MISSING",kind,flush=True)
          PY
      - name: Preserve all paired seed runs and any negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration28-12-new-seeds-48-genuine-IEEE118-source-GAdapt
          path: |
            iteration28_seed_holdout.csv
            iteration28_seed_holdout.json
