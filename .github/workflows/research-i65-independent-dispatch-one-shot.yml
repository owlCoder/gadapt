name: I65 independent AC dispatch reconstruction (one-shot)

# Direct one-level workflow_run child of a separately authorized short root job.
# No push, PR, schedule or automatic optimizer experiments.
on:
  workflow_run:
    workflows:
      - "Research full-clone migration regression (manual only)"
    types: [completed]

permissions:
  contents: read

jobs:
  reconstruct-ac-dispatch:
    if: ${{ github.event.workflow_run.id == 41357664531 && github.event.workflow_run.run_attempt == 8 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed compatible test-only stack
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -e .
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==1.26.4' 'scipy>=1.15,<1.17' 'PYPOWER==5.1.19' 'networkx>=3,<4'
          .venv/bin/python -m pip check
      - name: Run 47 known analytic tests and single-case real dispatch cross-check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dispatch"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/dispatch/commit.txt"
          trap '( cd "$RUNNER_TEMP/dispatch"; for f in *.log *.json commit.txt; do if [ -f "$f" ]; then sha256sum "$f"; fi; done ) > "$RUNNER_TEMP/dispatch/hashes.sha256"' EXIT
          .venv/bin/python -m unittest discover -s research/i65 -p 'test_independent_ac_dispatch.py' -v 2>&1 | tee "$RUNNER_TEMP/dispatch/dispatch_unit.log"
          .venv/bin/python -m unittest discover -s research/i65 -p 'test_independent_ac_newton.py' -v 2>&1 | tee "$RUNNER_TEMP/dispatch/newton_unit.log"
          .venv/bin/python -m unittest discover -s research/i65 -p 'test_orpd_operational_witness.py' -v 2>&1 | tee "$RUNNER_TEMP/dispatch/constraints_unit.log"
          .venv/bin/python research/compat/restore_legacy_paths.py --apply --verify 2>&1 | tee "$RUNNER_TEMP/dispatch/restore.log"
          timeout 120s .venv/bin/python research/i65/smoke_independent_ac_dispatch.py 2>&1 | tee "$RUNNER_TEMP/dispatch/smoke.json"
          .venv/bin/python -m json.tool "$RUNNER_TEMP/dispatch/smoke.json" > /dev/null
      - name: Save raw evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i65-independent-dispatch-${{ github.run_id }}
          path: ${{ runner.temp }}/dispatch/
          if-no-files-found: warn
          retention-days: 30
