name: GÉANT measured temporal traffic probe

on:
  push:
    branches:
      - "research/**"
    paths:
      - "research/geant_dynamic_probe.py"
      - ".github/workflows/geant-dynamic-data.yml"
  workflow_dispatch:

jobs:
  real-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . 'scipy>=1.11,<1.16' 'networkx>=3.2,<4'
      - run: python -m research.geant_dynamic_probe | tee geant_dynamic_quality.txt
      - uses: actions/upload-artifact@v4
        with:
          name: geant-measured-temporal-data-check
          path: geant_dynamic_quality.txt
