name: I65 I55 archived NPZ read-only PR audit

# Only archived original source bytes, frozen metadata and synthetic tests.
# This workflow MUST NOT execute an optimizer, PF/AC, or held-out COCO runs.
# Final isolated gate: I32 source restoration is handled in separate draft PR #15.
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/i65/archive_review/**'
      - '.github/workflows/research-i65-i55-pr-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact original Git history, retained NPZ source files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.11 for frozen archive readers
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only numpy for read-only NPZ decoding
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Exercise 181-source evidence and SHA-pinned adversarial tests
        run: |
          python -m unittest discover -s research/i65/archive_review -p 'test_i55_181_npz*.py' -v
          python -m unittest discover -s research/i65/archive_review -p 'test_i55_original_npz_connector_replay.py' -v
      - name: Fail-closed authentication of published 181-witness evidence
        run: |
          python research/i65/archive_review/i55_181_npz_evidence_reconcile.py \
            --repo-root . --output i55_181_new_sha_pinned_evidence_audit.json
      - name: Fail-closed original I64-R / frozen E input SHA256 custody synthetic tests
        run: |
          python -m py_compile research/i65/archive_review/i64_r_off_git_raw_recovery_gate.py research/i65/archive_review/i64_r_e_source_manifest_validation.py
          python -m unittest discover -s research/i65/archive_review -p 'test_i64_r_e_source_manifest_validation.py' -v
          python -m unittest discover -s research/i65/archive_review -p 'test_i64_r_original_budget_strict_consistency.py' -v
          python -m unittest discover -s research/i65/archive_review -p 'test_i64_r_archived_e_only_attestation.py' -v
          python -m unittest discover -s research/i65/archive_review -p 'test_i64_r_e_only_end_to_end_contract.py' -v
          python research/i65/archive_review/i64_r_archived_e_only_attestation.py \
            --repo-root . \
            --output i64_r_e_only_sha256_archived_sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i64_r_e_only_sha256_archived_sources.json').read_text())
          assert r['E_inputs']['E_original_manifest_entries']==67
          assert r['E_inputs']['required_for_independent_R_seed_bootstrap']==44
          assert r['E_inputs']['E_required_source_SHA256_verified']==44
          assert r['E_inputs']['E_source_sha256_verified_count']==66
          assert not r['E_inputs']['E_full_original_input_manifest_present_and_sha256_verified']
          assert not r['E_inputs']['ready_for_independent_raw_seed_bootstrap']
          assert r['R_original_raw_4200_seed_source']=='MISSING_NOT_RECREATED'
          print('ORIGINAL SHA256: 66 tracked E inputs PASS; missing E aggregate and R raw NOT RECREATED')
          PY
          python - <<'PY'
          import sys, inspect
          sys.path.insert(0, 'research/i65/archive_review')
          import i64_r_off_git_raw_recovery_gate as gate
          import i64_r_e_source_manifest_validation as e
          assert gate.validate_required_e_inputs is e.validate_required_e_inputs
          assert 'validate_required_e_inputs(' in inspect.getsource(gate.audit)
          assert 'original_r_roster_attested=' in inspect.getsource(gate.audit)
          assert 'struct[\'records_checked\']==4200' in inspect.getsource(gate.audit)
          print('ORIGINAL R RECOVERY GATE INTEGRATION SHA256-E-INPUT FAIL-CLOSED: PRESENT')
          PY
      - name: Recheck frozen oracle, original source schema and Git tree gates
        run: |
          python -m unittest discover -s research/i65/archive_review -p 'test_i55_frozen_objective_oracle.py' -v
          python -m unittest discover -s research/i65/archive_review -p 'test_i55_full_npz_attestation.py' -v
      - name: Recompute all original 620 A-process NPZ traces without optimizers
        run: |
          python research/i65/archive_review/i55_full_npz_attestation.py \
            --repo-root . --output i55_620_original_readonly_audit.json
      - name: Reconcile full 620 frozen detector flag census (read-only)
        run: |
          python -m unittest discover -s research/i65/archive_review -p 'test_i55_620_flag_census.py' -v
          python research/i65/archive_review/i55_620_flag_census.py \
            --repo-root . \
            --full-attestation i55_620_original_readonly_audit.json \
            --output i55_620_original_flag_census.json
      # Historical 10 failed source cells form five shared Nevergrad 10D strata.
      - name: Matched C1/C2 function context (original A traces only)
        run: |
          python -m unittest discover -s research/i65/archive_review -p 'test_i55_paired_function_context_audit.py' -v
          python research/i65/archive_review/i55_paired_function_context_audit.py \
            --repo-root . \
            --full-attestation i55_620_original_readonly_audit.json \
            --output i55_620_paired_function_context.json
      - name: Read-only original binary NPZ C1/C2 phase and repeat transition audit
        run: |
          python -m unittest discover -s research/i65/archive_review -p 'test_i55_620_npz_phase_duplicate_context.py' -v
          python research/i65/archive_review/i55_620_npz_phase_duplicate_context.py \
            --repo-root . \
            --full-attestation i55_620_original_readonly_audit.json \
            --output i55_620_npz_phase_duplicate_context.json
      - name: Original 620 NPZ signed full-corner direction / exact duplicate evidence (read-only)
        run: |
          python -m unittest discover -s research/i65/archive_review -p 'test_i55_620_corner_direction_source_audit.py' -v
          python research/i65/archive_review/i55_620_corner_direction_source_audit.py \
            --repo-root . \
            --full-attestation i55_620_original_readonly_audit.json \
            --output i55_620_original_corner_sign_and_repeats.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i55_620_original_corner_sign_and_repeats.json').read_text())
          assert r['original_npz_checked']==620
          assert r['historical_C1_corner_occurrences']==2105
          assert r['historical_C1_exact_repeats']==1956
          assert r['historical_C1_first']==149
          assert r['original_C1_post_calls']==0
          assert r['new_optimizer_PF_OPF_COCO_runs']==0
          print('ORIGINAL I55 620 NPZ C1 +/- CORNER DIRECTION AND REPEATS: authenticated')
          PY
      - name: Preserve reports even if an attestation gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i55-pinned-original-source-only-audit
          path: |
            i64_r_e_only_sha256_archived_sources.json
            i55_181_new_sha_pinned_evidence_audit.json
            i55_620_original_readonly_audit.json
            i55_620_original_flag_census.json
            i55_620_paired_function_context.json
            i55_620_npz_phase_duplicate_context.json
            i55_620_original_corner_sign_and_repeats.json
          if-no-files-found: warn
